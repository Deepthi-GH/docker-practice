services: #services is the main section where you define all the containers your application needs.
  mongodb:
    build: ./mongodb   #./folder → folder inside current directory
    image: kattika/mongodb:v1
    container_name: mongodb
    volumes:
    - mongodb:/data/db
  catalogue:
    build:
      context: ./catalogue
      dockerfile: Dockerfile
    image: kattika/catalogue:v1
    container_name: catalogue
    depends_on: 
    - mongodb
  redis:
    image: redis:7.0
    container_name: redis 
    volumes:
    - redis:/data
  user:
    build: ./user
    image: kattika/user:v1
    container_name: user
    depends_on:
    - redis
    - mongodb
  cart:
    build: ./cart
    image: kattika/cart:v1
    container_name: cart 
    depends_on:
    - redis
    - catalogue
  mysql:
    build: ./mysql
    image: kattika/mysql:v1
    container_name: mysql
    volumes:
    - mysql:/var/lib/mysql

  shipping:
    build: ./shipping
    image: kattika/shipping:v1
    container_name: shipping
    depends_on: 
    - mysql
    - cart
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop 
      RABBITMQ_DEFAULT_PASS: roboshop123
    volumes: # This is equivalent to -v rabbitmq:/var/lib/rabbitmq
    - rabbitmq:/var/lib/rabbitmq  
  payment:
    build: ./payment
    image: kattika/payment:v1
    container_name: payment  
    depends_on: 
    - rabbitmq
    - cart
    - user
  frontend:
    build: ./frontend
    image: kattika/frontend:v1
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user 
    - cart
    - shipping
    - payment
networks:
  default:
    driver: bridge
    name: roboshop
    external: false #true if u have created network manually using docker network command.
volumes:
  mongodb: # This is equivalent to docker volume create mongodb
  redis:
  mysql:
  rabbitmq: 
