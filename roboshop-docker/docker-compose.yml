services: #services is the main section where you define all the containers your application needs.
  mongodb:
    image: mongodb:v1
    container_name: mongodb
  catalogue:
    image: catalogue:v1
    container_name: catalogue
    depends_on: 
    - mongodb
  redis:
    image: redis:v1
    container_name: redis 
  user:
    image: user:v1
    container_name: user
    depends_on:
    - redis
    - mongodb
  cart:
    image: cart:v1
    container_name: cart 
    depends_on:
    - redis
  mysql:
    image: mysql:v1
    container_name: mysql
  shipping:
    image: shipping:v1
    container_name: shipping
    depends_on: 
    - mysql
  rabbitmq:
    image: rabbitmq:v1
    container_name: rabbitmq
  payment:
    image: payment:v1
    container_name: payment  
    depends_on: 
    - rabbitmq

networks:
  default:
    driver: bridge
    name: roboshop
    external: false #true if u have created network manually using docker network command.

